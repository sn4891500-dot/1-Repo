<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Test Page</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f7f7f7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    main {
      padding: 2rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #fff;
      text-align: center;
      max-width: 320px;
    }
    h1 {
      margin-bottom: 1rem;
      font-size: 1.8rem;
    }
    p {
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a {
      color: #0066cc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Test Website</h1>
    <p>This is a very simple page you can use to check that hosting works.</p>
    <p><a href="https://example.com" target="_blank" rel="noopener">Example link</a></p>
  </main>
</body>
</html>
